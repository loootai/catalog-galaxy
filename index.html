<!doctype html>
<html lang="en" data-view="galaxy" data-panel="closed">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Catalog galaxy: a 3D map of the looot data API catalog</title>
    <meta name="description" content="Explore the looot catalog in 3D: 16 categories, 230 platforms and more than 2,000 data jobs, each with its cheapest listed price. looot gives an AI agent one key and one prepaid balance for data APIs from 90+ providers." />
    <meta name="theme-color" content="#0B2E22" />
    <link rel="icon" type="image/svg+xml" href="/brand/looot-mark.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180.png" />
    <link rel="canonical" href="https://loootai.github.io/catalog-galaxy/" />
    <meta property="og:title" content="Catalog galaxy" />
    <meta property="og:description" content="A 3D map of the looot data API catalog. Categories are clusters, platforms are stars, every job shows its cheapest listed price." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loootai.github.io/catalog-galaxy/" />
    <meta property="og:image" content="https://loootai.github.io/catalog-galaxy/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to the catalog</a>

    <header class="top">
      <a class="brand" href="https://looot.ai" aria-label="looot.ai home">
        <img src="/brand/looot-wordmark.png" alt="looot.ai" width="480" height="92" />
      </a>
      <div class="lede">
        <h1>Catalog galaxy</h1>
        <p>
          <a href="https://looot.ai">looot</a> gives an AI agent one key and one prepaid balance for 2,500+ data API
          endpoints from 90+ providers. This is the catalog as a map.
        </p>
      </div>
      <div class="search" role="search">
        <label for="search-input" class="sr-only">Search platforms and jobs</label>
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.75" />
          <path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
        </svg>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search platforms and jobs"
          role="combobox"
          aria-expanded="false"
          aria-controls="search-results"
          aria-autocomplete="list"
        />
        <kbd class="search-key" aria-hidden="true">/</kbd>
        <div id="search-results" class="results" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <nav class="links" aria-label="looot">
        <a href="https://looot.ai">looot.ai</a>
        <a href="https://docs.looot.ai">Docs</a>
        <button id="view-toggle" type="button" class="toggle" aria-pressed="false">List view</button>
      </nav>
    </header>

    <main id="content">
      <section id="stage" class="stage" aria-label="3D map of the catalog">
        <canvas
          id="scene"
          tabindex="0"
          role="img"
          aria-label="3D map of the looot catalog. Each cluster is a category and each star is a platform. Arrow keys orbit, plus and minus zoom, Escape steps back. The category list and the list view hold the same content."
        ></canvas>
        <div id="labels" class="labels" aria-hidden="true"></div>
        <div id="ring-hover" class="ring ring-hover" aria-hidden="true"></div>
        <div id="ring-selected" class="ring ring-selected" aria-hidden="true"></div>
        <div id="tooltip" class="tooltip" role="status" hidden></div>

        <nav id="legend" class="legend" aria-label="Categories"></nav>

        <div class="hud">
          <p id="totals" class="totals"></p>
          <p class="hint" id="hint">Drag to orbit, scroll or pinch to zoom, click a star. Keys: arrows, + and -, Esc.</p>
        </div>
        <div class="zoom" role="group" aria-label="Camera">
          <button type="button" id="zoom-in" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" /></svg>
          </button>
          <button type="button" id="zoom-out" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" /></svg>
          </button>
          <button type="button" id="zoom-reset" aria-label="Show the whole catalog">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <p id="stage-note" class="stage-note" hidden></p>
      </section>

      <aside id="panel" class="panel" aria-label="Selection" hidden></aside>

      <section id="list" class="list" aria-label="Catalog as a list" hidden></section>
    </main>

    <noscript>
      <div class="noscript">
        <p>
          This map needs JavaScript. The catalog itself is at <a href="https://looot.ai">looot.ai</a> and the API
          reference is at <a href="https://docs.looot.ai">docs.looot.ai</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
